# Publica el Observatorio en GitHub Pages cada vez que se guardan cambios en la rama main.
# Antes de publicar corre las pruebas: si alguna falla, no se publica nada y la versión anterior sigue en línea.
# Para activarlo (una sola vez): Settings → Pages → Build and deployment → Source: «GitHub Actions».
name: Publicar el Observatorio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - name: Pruebas
        run: npm test
      - name: Construir el sitio
        run: npm run build
        env:
          # Dirección pública (con dominio propio, la que se configure en Settings → Pages).
          URL_SITIO: ${{ steps.pages.outputs.base_url }}
      - name: Quitar lo que no se publica
        run: rm -rf dist/datos/demo dist/geo/LEEME.md
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
